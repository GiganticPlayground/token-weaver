services:
  token-weaver:
    image: ghcr.io/giganticplayground/token-weaver:latest-main
    container_name: token-weaver-swarm-example
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      LOG_TYPE: pretty
      TOKEN_WEAVER_CONFIG_PATH: /app/config/token-weaver.yaml
      TOKEN_WEAVER_PRIVATE_KEY_PATH: /app/config/keys/private-key.pem
      TOKEN_WEAVER_KID: token-weaver-swarm-example
      TW_INBOUND_KEY: dev-inbound-key
      SWARM_SHARED_SECRET: dev-swarm-secret
    volumes:
      - ./token-weaver.yaml:/app/config/token-weaver.yaml:ro
      - ./keys:/app/config/keys:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
