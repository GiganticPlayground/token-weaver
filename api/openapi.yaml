openapi: 3.0.3
info:
  title: Token Weaver API
  description: Configurable authentication gateway for issuing JWTs
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local server

tags:
  - name: Auth
    description: Authentication and key discovery endpoints
  - name: System
    description: Service health endpoints

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - System
      operationId: getHealth
      x-eov-operation-id: getHealth
      x-eov-operation-handler: healthController
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /auth:
    post:
      summary: Authenticate and return a signed JWT
      tags:
        - Auth
      operationId: postAuth
      x-eov-operation-id: postAuth
      x-eov-operation-handler: authController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid inbound token, invalid credential, or upstream rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No matching strategy for this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Upstream service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /.well-known/jwks.json:
    get:
      summary: Return the public JSON Web Key Set
      tags:
        - Auth
      operationId: getJwks
      x-eov-operation-id: getJwks
      x-eov-operation-handler: authController
      responses:
        '200':
          description: Active signing key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
        '503':
          description: Signing key unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    HealthCheck:
      type: object
      required:
        - status
        - timestamp
        - service
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: token-weaver
    AuthRequest:
      type: object
      description: Flexible request body. Strategy-specific fields are mapped from this payload.
      additionalProperties: true
    AuthSuccess:
      type: object
      required:
        - token
        - expires_in
      properties:
        token:
          type: string
        expires_in:
          type: integer
          minimum: 1
    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      required:
        - kty
        - use
        - alg
        - kid
        - n
        - e
      properties:
        kty:
          type: string
          example: RSA
        use:
          type: string
          example: sig
        alg:
          type: string
          example: RS256
        kid:
          type: string
          example: token-weaver-key
        n:
          type: string
        e:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
